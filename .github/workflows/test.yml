name: Test

# Runs on every PR and every push to main: the gate that catches a broken
# change before it merges. release-cli.yml repeats these steps before
# packaging a release.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root package
        run: npm ci
      - name: Typecheck + test root package
        run: |
          npm run typecheck
          npm test
